name: Aseprite - antiX 23.2 Pentium B960

on:
  workflow_dispatch:

jobs:
  build:
    name: antiX 23.2 x86_64 - Pentium B960
    runs-on: ubuntu-22.04

    container:
      image: debian:12

    steps:

      # ============================================================
      # 1. Git must exist BEFORE actions/checkout
      # ============================================================

      - name: Prepare build environment
        shell: bash
        run: |
          set -eux

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            ca-certificates \
            git \
            curl \
            unzip \
            file \
            patchelf \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libpng-dev \
            libjpeg-dev \
            libwebp-dev

          git --version
          cmake --version
          ninja --version
          clang --version


      # ============================================================
      # 2. Checkout Aseprite + submodules
      # ============================================================

      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      # ============================================================
      # 3. Download official Aseprite Skia
      # ============================================================

      - name: Download Skia
        shell: bash
        run: |
          set -eux

          chmod +x laf/misc/skia-url.sh

          SKIA_URL="$(./laf/misc/skia-url.sh)"

          echo "Using Skia:"
          echo "$SKIA_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$SKIA_URL" \
            -o skia.zip

          mkdir -p skia

          unzip -q skia.zip -d skia


      # ============================================================
      # 4. Configure compiler
      # ============================================================

      - name: Configure compiler
        shell: bash
        run: |
          set -eux

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

          clang --version
          clang++ --version


      # ============================================================
      # 5. Configure Aseprite
      # ============================================================

      - name: Configure Aseprite
        shell: bash
        run: |
          set -eux

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-O3 -march=sandybridge -mtune=sandybridge -DNDEBUG" \
            -DCMAKE_CXX_FLAGS="-O3 -march=sandybridge -mtune=sandybridge -DNDEBUG" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DENABLE_TESTS=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_BENCHMARKS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$GITHUB_WORKSPACE/skia" \
            -DSKIA_LIBRARY_DIR="$GITHUB_WORKSPACE/skia/out/Release-x64"


      # ============================================================
      # 6. Build
      # ============================================================

      - name: Build Aseprite
        shell: bash
        run: |
          set -eux

          cmake \
            --build build \
            --target aseprite \
            --parallel 2


      # ============================================================
      # 7. Verify
      # ============================================================

      - name: Verify Aseprite
        shell: bash
        run: |
          set -eux

          echo "===== FILE ====="
          file build/bin/aseprite

          echo
          echo "===== LIBRARIES ====="
          ldd build/bin/aseprite || true

          echo
          echo "===== SIZE ====="
          ls -lh build/bin/aseprite


      # ============================================================
      # 8. Create portable package
      # ============================================================

      - name: Package Aseprite
        shell: bash
        run: |
          set -eux

          rm -rf package

          mkdir -p package/aseprite

          cp build/bin/aseprite \
             package/aseprite/

          if [ -d build/bin/data ]; then
            cp -r build/bin/data \
              package/aseprite/
          fi

          chmod +x package/aseprite/aseprite


      # ============================================================
      # 9. Launcher
      # ============================================================

      - name: Create launcher
        shell: bash
        run: |
          set -eux

          cat > package/aseprite/run-aseprite.sh <<'EOF'
#!/bin/sh

HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"

exec "$HERE/aseprite" "$@"
EOF

          chmod +x package/aseprite/run-aseprite.sh


      # ============================================================
      # 10. Create final archive
      # ============================================================

      - name: Create archive
        shell: bash
        run: |
          set -eux

          tar \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf \
            aseprite-antix23-pentium-b960-x86_64.tar.gz \
            -C package \
            aseprite


      # ============================================================
      # 11. Upload
      # ============================================================

      - name: Upload final Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-antix23-pentium-b960-x86_64
          path: aseprite-antix23-pentium-b960-x86_64.tar.gz
          if-no-files-found: error
